<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Girlfriends Day</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="intro">
            <div class="intro_box" id="box1"></div>
            
            <div class="btn" id="intro_btn"></div>

            <div class="intro_box" id="box2"></div>
        </div>
        <div class="info">
            <div class="text">
                <h3>HAPPY NATIONAL</h3>
                <h3>GIRLFRIENDS DAY BABY</h3>
            </div>



            <div class="dec_btn">
                <button class="btn_choice" id="gift_btn">SHOW GIFT</button>
                <button class="btn_choice" id="no_gift_btn">NO DONT NEED IT</button>
            </div>

            <div class="gift">
                <div class="img1">
                    <img src="assets/images/Gift.png" alt="Gift box">
                </div>
                <div class="img2">
                    <img src="assets/images/gift2.png" alt="Second gift box">
                </div>
                <h3 class="letter">
                    <span>HAPPY GIRLFRIENDS DAY MAMA</span>
                    Each day with you is a blessing, and I am grateful for your love and support. You are my Chubby Princess, my motivation to do better, and my best friend. I love you more than words can express.
                </h3>
            </div>
        </div>
    </main>
    <script src="script.js"></script>   
</body>
</html>
